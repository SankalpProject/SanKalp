# Automated tests: self-contained, never reads the developer's secrets.properties.
# Fast in-memory persistence by default; Postgres adapters are covered by tests on an embedded PostgreSQL.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  flyway:
    enabled: false

# Same port as the API in tests, so MockMvc can verify the actuator stays locked down when not isolated.
management:
  server:
    port:

auth:
  persistence: memory
  hash-pepper: test-only-pepper-0123456789abcdef0123456789
  otp:
    sender: log
  jwt:
    allow-ephemeral-keys: true
  google:
    client-ids: test-client-id.apps.googleusercontent.com
