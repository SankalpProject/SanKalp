# ------------------------------------------------------------------------------------------
# LOCAL DEVELOPMENT SECRETS — TEMPLATE
#
# 1. Copy this file to  secrets.properties  (same folder). secrets.properties is git-ignored.
# 2. Fill in your values once. The backend loads it automatically in the dev profile
#    (mvn spring-boot:run, IntelliJ, Eclipse — run from the auth-service folder).
#
# In production these are NOT read from a file: set the same settings as environment variables
# / secrets in your hosting platform (SPRING_MAIL_PASSWORD, AUTH_GOOGLE_CLIENT_IDS, ...).
# ------------------------------------------------------------------------------------------

# ---- Send OTP emails to the user's real inbox (Gmail, free) ----
# Needs a Gmail "App password": https://myaccount.google.com/apppasswords (2-Step Verification must be on)
auth.otp.sender=smtp
auth.otp.mail-from=MyApp <yourgmail@gmail.com>
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=yourgmail@gmail.com
spring.mail.password=your-16-char-app-password

# ---- Google Sign-In ----
# The "Web application" OAuth client id from Google Cloud Console (same value as googleWebClientId in the app)
auth.google.client-ids=1234567890-xxxxxxxx.apps.googleusercontent.com
