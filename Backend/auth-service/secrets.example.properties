# ------------------------------------------------------------------------------------------
# LOCAL DEVELOPMENT SECRETS — TEMPLATE
#
# 1. Copy this file to  secrets.properties  (same folder). secrets.properties is git-ignored.
# 2. Fill in the REQUIRED section. Optional sections stay commented out until you need them.
#    The backend loads secrets.properties automatically in the dev profile
#    (mvn spring-boot:run, IntelliJ, Eclipse — run from the auth-service folder).
#
# In production these are NOT read from a file: set the same settings as environment variables
# / secrets in your hosting platform (SPRING_DATASOURCE_PASSWORD, SPRING_MAIL_PASSWORD, ...).
# ------------------------------------------------------------------------------------------

# ======================= REQUIRED: PostgreSQL =======================
# The two passwords YOU chose when running db/setup-local.sql (use two different passwords).
# Runtime app login (sankalp_app):
spring.datasource.password=choose-a-strong-app-password
# Schema owner login (sankalp_migrator), used only by Flyway at startup:
spring.flyway.password=choose-a-different-strong-password

# Only if your PostgreSQL does NOT listen on the default port 5432 (e.g. the installer picked 5431):
# spring.datasource.url=jdbc:postgresql://localhost:5431/sankalp

# ============ OPTIONAL: send OTP emails to real inboxes (Gmail, free) ============
# Without this section, OTP codes are printed in the backend console (fine for development).
# Needs a Gmail "App password": https://myaccount.google.com/apppasswords (2-Step Verification must be on)
# auth.otp.sender=smtp
# auth.otp.mail-from=MyApp <yourgmail@gmail.com>
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=yourgmail@gmail.com
# spring.mail.password=your-16-char-app-password

# ======================= OPTIONAL: Google Sign-In =======================
# The team's "Web application" OAuth client id (public, not a secret): same value as googleWebClientId
# in MobileApp/src/config/env.ts. Without it, Google sign-in is rejected by the backend.
# auth.google.client-ids=1234567890-xxxxxxxx.apps.googleusercontent.com
